Description = "IMPORTANT: Download grpc-labview.zip from the NI gRPC LabVIEW repository on GitHub and install the three VI packages it contains. The template will not run without them:\0D\0Dhttps://github.com/ni/grpc-labview/releases/download/v1.7.0.1/grpc-labview.zip\0D\0D----\0D\0DProvides a gRPC Server Worker template that can be used to exchange typed messages with gRPC clients written in LabVIEW, Python, C++, or other supported languages.\0D\0DThe Worker uses a bidirectional gRPC stream defined by template.proto. Messages sent from the Workers application to the client are exposed as Public Requests, while messages received from the client are returned to the Caller as Public Responses.\0D\0DModify the message payloads in template.proto to define the data required by your application, then regenerate the NI gRPC server library and use it with the existing Worker template.\0D\0DRT Compatible: Untested. The NI gRPC library supports NI Linux RT with system image 2022 Q4 or later.\0D\0DOther: The template ships as a complete project with a Tester Worker, so it can be run and studied on its own before being adapted. Use it together with the gRPC Client Template, or with a client application written in another programming language that implements the same contract."
Version = "1.0"
